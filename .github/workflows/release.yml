# 推送 x.y.z tag 时自动构建并发布 GitHub Release(附三件套)。
# 社区市场通过 Release tag == manifest version 下载 main.js/manifest.json/styles.css。
name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  # Artifact attestations 需要的权限(社区市场校验 release 资产来源)
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
